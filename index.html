<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Calculator</title>

<style>

:root{
  --bg1:#0f172a;
  --bg2:#1e293b;
  --card:rgba(255,255,255,0.08);
  --text:#fff;
  --btn:#1f2937;
  --op:#f59e0b;
}

body.light{
  --bg1:#e2e8f0;
  --bg2:#f8fafc;
  --card:rgba(0,0,0,0.08);
  --text:#000;
  --btn:#d1d5db;
  --op:#f59e0b;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  transition:0.3s;
}

/* layout */
.app{
  display:flex;
  gap:20px;
}

/* calculator */
.calc{
  width:350px;
  padding:20px;
  border-radius:25px;
  background:var(--card);
  backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

/* history */
.history{
  width:220px;
  max-height:420px;
  overflow:auto;
  padding:15px;
  border-radius:20px;
  background:var(--card);
  color:var(--text);
}

/* display */
#display{
  width:100%;
  height:80px;
  font-size:30px;
  text-align:right;
  border:none;
  outline:none;
  border-radius:15px;
  padding:10px;
  background:rgba(0,0,0,0.3);
  color:var(--text);
}

/* grid */
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

/* buttons */
button{
  height:55px;
  border:none;
  border-radius:15px;
  font-size:16px;
  cursor:pointer;
  color:var(--text);
  transition:0.15s;
  position:relative;
  overflow:hidden;
}

button:active{
  transform:scale(0.92);
}

/* ripple effect */
button::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:rgba(255,255,255,0.2);
  opacity:0;
  transition:0.3s;
}

button:active::after{
  opacity:1;
}

/* styles */
.num{ background:var(--btn); }
.op{ background:var(--op); color:#000; }

.long{
  grid-column:span 2;
}

/* toggle */
.toggle{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:none;
  border-radius:12px;
  background:var(--op);
  cursor:pointer;
  font-weight:bold;
}

/* mobile */
@media(max-width:800px){
  .app{ flex-direction:column; }
}

</style>
</head>

<body>

<div class="app">

<div class="calc">

<button class="toggle" onclick="toggleTheme()">🌙 / ☀ Theme</button>

<input id="display" disabled>

<div class="buttons">

<button class="op" onclick="append('Math.sin(')">sin</button>
<button class="op" onclick="append('Math.cos(')">cos</button>
<button class="op" onclick="append('Math.tan(')">tan</button>
<button class="op" onclick="clearAll()">AC</button>

<button class="op" onclick="append('Math.sqrt(')">√</button>
<button class="op" onclick="append('Math.log10(')">log</button>
<button class="op" onclick="append('Math.log(')">ln</button>
<button class="op" onclick="append('Math.PI')">π</button>

<button class="num">7</button>
<button class="num">8</button>
<button class="num">9</button>
<button class="op" onclick="append('/')">÷</button>

<button class="num">4</button>
<button class="num">5</button>
<button class="num">6</button>
<button class="op" onclick="append('*')">×</button>

<button class="num">1</button>
<button class="num">2</button>
<button class="num">3</button>
<button class="op" onclick="append('-')">−</button>

<button class="num long" onclick="append('0')">0</button>
<button class="num" onclick="append('.')">.</button>
<button class="op" onclick="append('+')">+</button>

<button class="op long" onclick="calculate()">=</button>

</div>
</div>

<div class="history" id="history">
<h3>History</h3>
</div>

</div>

<script>

let display = document.getElementById("display");
let history = document.getElementById("history");

/* input */
function append(val){
  display.value += val;
}

/* clear */
function clearAll(){
  display.value = "";
}

/* safe calculation */
function calculate(){
  try{
    let result = Function("return " + display.value)();
    history.innerHTML += `<div>${display.value} = ${result}</div>`;
    display.value = result;
  }catch{
    display.value = "Error";
  }
}

/* theme */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* keyboard support */
document.addEventListener("keydown",(e)=>{
  if(!isNaN(e.key) || "+-*/.".includes(e.key)){
    append(e.key);
  }
  if(e.key==="Enter") calculate();
  if(e.key==="Backspace") display.value = display.value.slice(0,-1);
});

</script>

</body>
</html>
