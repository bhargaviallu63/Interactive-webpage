<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicorn Calculator</title>

<style>

/* 🌈 BACKGROUND WITH UNICORN IMAGE */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;

  background-image:url("https://images.unsplash.com/photo-1534447677768-be436bb09401");
  background-size:cover;
  background-position:center;
}

/* GLASS EFFECT WRAPPER */
.wrapper{
  display:flex;
  gap:20px;
}

/* CALCULATOR CARD */
.calc{
  width:340px;
  padding:20px;
  border-radius:25px;

  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(15px);

  box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

/* DISPLAY */
#display{
  width:100%;
  height:80px;
  font-size:30px;
  text-align:right;
  border:none;
  border-radius:15px;
  padding:10px;

  background:#111;
  color:#fff;
}

/* BUTTON GRID */
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

/* BASE BUTTON */
button{
  height:60px;
  border:none;
  border-radius:15px;
  font-size:18px;
  cursor:pointer;
  transition:0.15s;
}

/* CLICK ANIMATION */
button:active{
  transform:scale(0.88);
}

/* 🌈 COLORFUL BUTTONS */
.num{
  background:linear-gradient(135deg,#6366f1,#3b82f6);
  color:white;
}

.op{
  background:linear-gradient(135deg,#f97316,#fb923c);
  color:white;
}

.equal{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  grid-column:span 2;
}

.clear{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:white;
}

.func{
  background:linear-gradient(135deg,#a855f7,#6366f1);
  color:white;
}

/* HISTORY PANEL */
.history{
  width:220px;
  padding:15px;
  border-radius:20px;

  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);

  color:white;
  max-height:420px;
  overflow:auto;
}

/* MOBILE */
@media(max-width:800px){
  .wrapper{
    flex-direction:column;
    align-items:center;
  }
}

</style>
</head>

<body>

<div class="wrapper">

<!-- CALCULATOR -->
<div class="calc">

<input id="display" disabled>

<div class="buttons">

<!-- FUNCTIONS -->
<button class="func" onclick="append('Math.sin(')">sin</button>
<button class="func" onclick="append('Math.cos(')">cos</button>
<button class="func" onclick="append('Math.tan(')">tan</button>
<button class="clear" onclick="clearAll()">AC</button>

<button class="func" onclick="append('Math.sqrt(')">√</button>
<button class="func" onclick="append('Math.log10(')">log</button>
<button class="func" onclick="append('Math.PI')">π</button>
<button class="func" onclick="append('Math.E')">e</button>

<!-- NUMBERS -->
<button class="num" onclick="append('7')">7</button>
<button class="num" onclick="append('8')">8</button>
<button class="num" onclick="append('9')">9</button>
<button class="op" onclick="append('/')">÷</button>

<button class="num" onclick="append('4')">4</button>
<button class="num" onclick="append('5')">5</button>
<button class="num" onclick="append('6')">6</button>
<button class="op" onclick="append('*')">×</button>

<button class="num" onclick="append('1')">1</button>
<button class="num" onclick="append('2')">2</button>
<button class="num" onclick="append('3')">3</button>
<button class="op" onclick="append('-')">−</button>

<button class="num" onclick="append('0')">0</button>
<button class="num" onclick="append('.')">.</button>
<button class="op" onclick="append('+')">+</button>

<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<!-- HISTORY -->
<div class="history" id="history">
<h3>🦄 History</h3>
</div>

</div>

<script>

let display = document.getElementById("display");
let history = document.getElementById("history");

/* ADD INPUT */
function append(val){
  display.value += val;
}

/* CLEAR */
function clearAll(){
  display.value = "";
}

/* SAFE CALCULATION */
function calculate(){
  try{
    let result = Function("return " + display.value)();

    if(result === undefined || result === null){
      display.value = "Error";
      return;
    }

    // history add (FAST METHOD)
    const item = document.createElement("div");
    item.textContent = display.value + " = " + result;
    history.appendChild(item);

    display.value = result;

  }catch{
    display.value = "Error";
  }
}

</script>

</body>
</html>
