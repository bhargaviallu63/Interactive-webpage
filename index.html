<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Safe Calculator</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#121212;
}

.wrapper{ display:flex; gap:20px; }

.calc{
  width:340px;
  padding:20px;
  border-radius:20px;
  background:#1f1f2e;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

#display{
  width:100%;
  height:80px;
  font-size:28px;
  text-align:right;
  border:none;
  border-radius:12px;
  padding:10px;
  background:#000;
  color:#fff;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

button{
  height:55px;
  border:none;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
  transition:0.1s;
}

button:active{ transform:scale(0.9); }

.num{ background:#4f46e5; color:white; }
.op{ background:#f97316; color:white; }
.equal{ background:#22c55e; color:white; grid-column:span 2; }
.clear{ background:#ef4444; color:white; }
.func{ background:#8b5cf6; color:white; }

.history{
  width:220px;
  padding:15px;
  border-radius:20px;
  background:#1f1f2e;
  color:white;
  max-height:420px;
  overflow:auto;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="calc">
<input id="display" disabled>

<div class="buttons">

<button class="func" onclick="append('sin(')">sin</button>
<button class="func" onclick="append('cos(')">cos</button>
<button class="func" onclick="append('tan(')">tan</button>
<button class="clear" onclick="clearAll()">AC</button>

<button class="func" onclick="append('sqrt(')">√</button>
<button class="func" onclick="append('log10(')">log</button>
<button class="func" onclick="append('log(')">ln</button>
<button class="func" onclick="append('PI')">π</button>

<button class="num" onclick="append('7')">7</button>
<button class="num" onclick="append('8')">8</button>
<button class="num" onclick="append('9')">9</button>
<button class="op" onclick="append('/')">÷</button>

<button class="num" onclick="append('4')">4</button>
<button class="num" onclick="append('5')">5</button>
<button class="num" onclick="append('6')">6</button>
<button class="op" onclick="append('*')">×</button>

<button class="num" onclick="append('1')">1</button>
<button class="num" onclick="append('2')">2</button>
<button class="num" onclick="append('3')">3</button>
<button class="op" onclick="append('-')">−</button>

<button class="num" onclick="append('0')">0</button>
<button class="num" onclick="append('.')">.</button>
<button class="op" onclick="append('+')">+</button>
<button class="clear" onclick="backspace()">⌫</button>

<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<div class="history" id="history">
<h3>History</h3>
</div>

</div>

<script>

let display = document.getElementById("display");
let history = document.getElementById("history");

function append(val){
  let last = display.value.slice(-1);

  // block double operators
  if("+-*/".includes(val) && "+-*/".includes(last)){
    return;
  }

  display.value += val;
}

function clearAll(){
  display.value = "";
}

function backspace(){
  display.value = display.value.slice(0,-1);
}

// SAFE ENGINE
function safeEval(expr){
  try{

    expr = expr.replace(/PI/g, Math.PI);
    expr = expr.replace(/log10\(/g, "Math.log10(");
    expr = expr.replace(/log\(/g, "Math.log(");
    expr = expr.replace(/sin\(/g, "Math.sin(");
    expr = expr.replace(/cos\(/g, "Math.cos(");
    expr = expr.replace(/tan\(/g, "Math.tan(");
    expr = expr.replace(/sqrt\(/g, "Math.sqrt(");

    let result = Function("Math", "return " + expr)(Math);

    if(!isFinite(result)) return "Error";

    return Math.round(result * 100000) / 100000; // rounding fix

  }catch{
    return "Error";
  }
}

function calculate(){
  if(display.value.trim() === "") return;

  let expr = display.value;
  let result = safeEval(expr);

  let item = document.createElement("div");
  item.style.margin = "5px 0";
  item.textContent = `${expr} = ${result}`;
  history.appendChild(item);

  history.scrollTop = history.scrollHeight;

  display.value = result;
}

</script>

</body>
</html>
